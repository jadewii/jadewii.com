[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Disable Next.js telemetry
  NEXT_TELEMETRY_DISABLED = "1"
  # Force fresh builds
  NODE_ENV = "production"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# SPA redirect for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200